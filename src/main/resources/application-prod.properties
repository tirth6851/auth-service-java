spring.application.name=auth-platform

# OpenAPI / Swagger — disabled in production
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
server.port=8080

# PostgreSQL Database
spring.datasource.url=${POSTGRES_JDBC_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# JPA - validate schema, do not auto-update
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT - HS256 requires >=32 char secret
app.jwt.secret=${JWT_SECRET}
# Access token TTL: 15 min in production (ADR-005). Short-lived because the JWT is stateless and
# cannot be revoked before expiry; refresh tokens (7d, DB-backed, rotated) carry the session.
app.jwt.expiration-ms=900000

# Refresh token TTL (7 days in ms)
app.refresh-token.ttl-ms=604800000

# Actuator - Health check endpoint
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
