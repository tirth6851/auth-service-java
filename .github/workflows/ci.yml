name: CI

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Build and Test

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven verify
        run: mvn -B verify

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          retention-days: 30

  # Runs the Docker-gated Testcontainers tests (real PostgreSQL 16, Flyway migrations, ddl-auto=validate).
  # The default job runs on H2 with Flyway off, so only this job can catch Flyway/Hibernate/Postgres breakage.
  postgres-integration:
    runs-on: ubuntu-latest
    name: Postgres Integration

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Postgres integration tests
        run: mvn -B -Pintegration-test verify

  web-build:
    runs-on: ubuntu-latest
    name: Web Build

    defaults:
      run:
        working-directory: web

    # The build imports modules that require these to be set. Placeholder values only;
    # nothing here is used at runtime or is a real secret.
    env:
      SESSION_SECRET: ci-build-only-placeholder-0123456789abcdef
      AUTH_API_URL: http://localhost:8080

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
