name: DCO

# Every commit in a pull request must carry a "Signed-off-by:" trailer
# (`git commit -s`). See CONTRIBUTING.md -> Developer Certificate of Origin.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dco:
    name: Signed-off-by check
    # Dependabot cannot add a sign-off to its own commits.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Verify Signed-off-by trailers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            if ! git log -1 --format=%B "$sha" | grep -Eq '^Signed-off-by: .+ <[^<>@ ]+@[^<>@ ]+>[[:space:]]*$'; then
              echo "::error::Commit $sha is missing a 'Signed-off-by:' line. Fix with: git commit --amend -s (or git rebase --signoff main)"
              missing=1
            fi
          done
          exit "$missing"
